name: customer_mobile
description: Aplikasi customer TemenTrip dengan alur yang sama seperti web customer.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.7
  flutter_svg: ^2.2.2
  share_plus: ^10.1.4
  geolocator: ^13.0.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # Dipakai bila `--flavor` tidak diberikan; production hanya lewat `--flavor production`.
  default-flavor: staging
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Roboto statis dipaketkan karena desain Figma memakai bobot 600
  # (SemiBold) dan aplikasi tidak bergantung pada unduhan font.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
