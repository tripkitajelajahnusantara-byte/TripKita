name: CI

on:
  push:
    branches: [main, pre-release, staging]
  pull_request:
    branches: [main, pre-release, staging]
  workflow_dispatch:

# Push beruntun pada branch yang sama membatalkan run lama agar antrean CI tidak menumpuk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Verifikasi dependency tidak berubah
        run: go mod verify

      - name: Periksa format kode
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Berkas berikut belum diformat dengan gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/tripkita-api .

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: provider-web/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      # Image dibangun di CI supaya kegagalan Dockerfile ketahuan sebelum deploy,
      # bukan saat rilis ke production.
      - name: Build image backend
        run: docker build -f backend/Dockerfile -t tripkita-api:ci backend

      - name: Build image web
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 -t tripkita-web:ci provider-web
