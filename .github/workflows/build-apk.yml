name: Build Android APK

on:
  push:
    branches:
      - main
      - staging
    # Push yang hanya mengubah backend/web tidak perlu mengirim APK baru ke tester.
    paths:
      - 'customer-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # main -> production; branch lain (staging, workflow_dispatch) -> staging.
      FLAVOR: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Get Dependencies
        run: |
          cd customer-mobile
          flutter pub get

      - name: Build Signed Universal Release APK
        run: |
          cd customer-mobile
          chmod +x android/gradlew 2>/dev/null || true
          flutter build apk --release --flavor "$FLAVOR" --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons \
            --dart-define-from-file=env/$FLAVOR.json \
            --build-number=${{ github.run_number }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TemenTrip-Customer-App-${{ env.FLAVOR }}
          path: customer-mobile/build/app/outputs/flutter-apk/*.apk

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ github.ref_name == 'main' && secrets.FIREBASE_APP_ID_PRODUCTION || secrets.FIREBASE_APP_ID_STAGING }}
          # Lewat env, bukan ekspresi langsung di script, agar isi pesan commit tidak dieksekusi shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@14 appdistribution:distribute \
            customer-mobile/build/app/outputs/flutter-apk/app-$FLAVOR-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "[$GITHUB_REF_NAME ${GITHUB_SHA::7}] $COMMIT_MESSAGE"
