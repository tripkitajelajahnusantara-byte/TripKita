name: Build Android APK

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Get Dependencies
        run: |
          cd customer-mobile
          flutter pub get

      - name: Generate Release Keystore & Build Signed Universal APK
        run: |
          cd customer-mobile/android/app
          keytool -genkeypair -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass android -keypass android -dname "CN=TemenTrip, OU=Dev, O=TripKita, L=Jakarta, C=ID"
          cd ../..
          chmod +x android/gradlew 2>/dev/null || true
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TemenTrip-Customer-App
          path: customer-mobile/build/app/outputs/flutter-apk/*.apk
