name: Build Android APK

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd customer-mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd customer-mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemenTrip-Customer-App
          path: customer-mobile/build/app/outputs/flutter-apk/app-release.apk
